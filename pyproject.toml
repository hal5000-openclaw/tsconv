[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsconv"
version = "0.1.0"
description = "Convert timestamps and durations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
tsconv = "tsconv:main"

[tool.setuptools]
py-modules = ["tsconv"]
